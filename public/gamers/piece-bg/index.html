<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GAMERS — world plate (background)</title>
  <!--
    BACKGROUND "WORLD PLATE" — this is OUR design asset, NOT itsgalo's artwork.
    It loads a FORKED copy of the renderer (piece-bg/bundle.js) with the HUD draw
    calls gated off via window.__GAMERS_NO_HUD, so only the procedural terrain +
    sky render. His original piece in /piece/ is untouched and is what the hero
    shows, pure. After a brief warm-up we freeze the rAF loop to a single still
    frame — a painted backdrop with zero ongoing GPU cost (mobile-safe).
  -->
  <script>
    // must be set BEFORE the bundle module runs
    window.__GAMERS_NO_HUD = true;
  </script>
  <script src="./fxhash.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000;
    }
    canvas {
      display: block;
      transform: scale(1);
      transform-origin: center;
      image-rendering: pixelated;
    }
  </style>
</head>

<body>
  <canvas id="canvasGL" style="display: none;"></canvas>
  <canvas id="canvas2D"></canvas>
</body>

<script src="./bundle.js" type="module"></script>

<!--
  Bridge + FREEZE. The plate is a blurred atmospheric BACKDROP, not the artwork —
  it has no reason to keep animating once it has composed a frame. Running it as a
  perpetual second live WebGL loop (on top of the hero's) is what builds GPU/
  thermal load and throttles the page after a couple of minutes. So: post one
  ready ping the instant the canvas has painted (drives the parent's crossfade on
  re-roll, no guess-timer), let the camera settle briefly, THEN freeze the rAF
  loop to a single still frame — zero ongoing GPU cost, visually identical behind
  the blur. This restores the documented intent (the loop had silently drifted to
  "always live"). It does NOT emit palette/seed (only the hero /piece/ drives
  theming; emitting here would loop).
-->
<script>
  (function () {
    // tell the parent the moment we've actually painted terrain, so the
    // crossfade reveal is driven by real paint, not a fixed timeout.
    var pinged = false;
    function ready() {
      if (pinged) return;
      var cv = document.getElementById("canvas2D");
      if (!cv || !cv.width) return;
      pinged = true;
      try {
        window.parent.postMessage({ type: "gamers:plate-ready" }, "*");
      } catch (e) {}
      scheduleFreeze();
    }

    // Freeze the rAF loop after a short settle so the backdrop holds a composed,
    // camera-settled frame. We let the real loop keep ticking for SETTLE_MS, then
    // replace requestAnimationFrame with a no-op so the renderer's next loop
    // request is dropped — the canvas keeps its last painted frame, the GPU goes
    // quiet. cancelAnimationFrame is also neutralised so nothing errors.
    var SETTLE_MS = 2600; // ~camera settle; tuned so the frozen frame looks composed
    var frozen = false;
    function scheduleFreeze() {
      if (frozen) return;
      setTimeout(function () {
        if (frozen) return;
        frozen = true;
        try {
          window.requestAnimationFrame = function () { return 0; };
          window.cancelAnimationFrame = function () {};
        } catch (e) {}
      }, SETTLE_MS);
    }

    // poll briefly for the first composed frame; once the canvas has size and a
    // couple of rAF ticks have run, the terrain is on it.
    window.addEventListener("load", function () {
      var ticks = 0;
      (function spin() {
        ticks++;
        var cv = document.getElementById("canvas2D");
        if (cv && cv.width && ticks > 6) {
          ready();
          return;
        }
        if (ticks < 240) requestAnimationFrame(spin);
        else ready(); // safety: ping anyway so the parent never waits forever
      })();
    });
  })();
</script>

</html>
